id: org.freedesktop.LinuxAudio.Plugins.NeuralAmpModeler
branch: '25.08'
build-extension: true
runtime: org.freedesktop.LinuxAudio.BaseExtension
runtime-version: stable
sdk: org.freedesktop.Sdk//25.08
build-options:
  prefix: /app/extensions/Plugins/NeuralAmpModeler
modules:
  - name: NeuralAmpModeler
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DUSE_NATIVE_ARCH=ON
      - -DSMART_BYPASS_ENABLED=ON
      - -DNAM_ENABLE_A2_FAST=ON
      - -DNAM_USE_INLINE_GEMM=ON
      - -DBUILD_INTERNAL_STATIC_WAVENET=ON
      - -DBUILD_INTERNAL_STATIC_LSTM=ON
      - -DBUILD_STATIC_INTERNAL_NAMA2=ON
      - -DENABLE_MULTIFRAME_8X8_CONVOLUTION=ON
      - -DBUILD_NAMCORE=ON
      - -DBUILD_STATIC_RTNEURAL=ON
    post-install:
      - "mv ${FLATPAK_DEST}/lib/lv2 ${FLATPAK_DEST}"
      - "install -Dm644 deps/NeuralAudio/deps/NeuralAmpModelerCore/LICENSE ${FLATPAK_DEST}/share/licenses/${FLATPAK_ID}/NeuralAmpModelerCore/LICENSE"
      - "install -Dm644 org.freedesktop.LinuxAudio.Plugins.NeuralAmpModeler.metainfo.xml -t ${FLATPAK_DEST}/share/metainfo"
    cleanup:
      - lib
    sources:
      - type: git
        url: https://github.com/mikeoliphant/neural-amp-modeler-lv2
        tag: v0.2.2
        commit: 35c28a52ec0a89af16208e953544dc96e13dde20
      - type: file
        path: org.freedesktop.LinuxAudio.Plugins.NeuralAmpModeler.metainfo.xml
